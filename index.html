  <body class="bg-navy-900 text-slate-100 antialiased font-sans min-h-screen">
    <!-- Initial Professional App Loader (Replaced automatically by React on mount) -->
    <div id="root">
      <div style="min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #061426; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; color: #f8fafc; padding: 20px; box-sizing: border-box;">
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 22px;">
          <!-- Animated pulse ring -->
          <div style="position: absolute; width: 86px; height: 86px; border-radius: 50%; border: 2px solid rgba(0, 210, 255, 0.4); animation: pulseRing 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;"></div>
          <!-- App Icon -->
          <img src="/images/icono.png" alt="SISMO LAB" style="width: 68px; height: 68px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0, 210, 255, 0.25); position: relative; z-index: 1;" />
        </div>
        
        <h1 style="font-size: 19px; font-weight: 900; letter-spacing: 2px; color: #ffffff; text-transform: uppercase; margin: 0 0 5px 0; text-align: center;">
          SISMO <span style="color: #00d2ff;">LAB</span>
        </h1>
        <p style="font-size: 10.5px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 2.5px; margin: 0 0 20px 0; text-align: center;">
          Prevención Sísmica
        </p>

        <!-- Modern animated loader bar -->
        <div style="width: 130px; height: 4px; background: rgba(255, 255, 255, 0.08); border-radius: 999px; overflow: hidden; position: relative;">
          <div style="position: absolute; top: 0; left: 0; bottom: 0; width: 40%; background: linear-gradient(90deg, #00d2ff, #38bdf8); border-radius: 999px; animation: loaderBar 1.4s ease-in-out infinite;"></div>
        </div>

        <style>
          @keyframes pulseRing {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(1.35); opacity: 0; }
          }
          @keyframes loaderBar {
            0% { left: -40%; width: 30%; }
            50% { left: 35%; width: 50%; }
            100% { left: 100%; width: 30%; }
          }
        </style>
      </div>
    </div>

    <!-- Fallback for browsers with JavaScript disabled -->
